<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050403" />
    <title>GOTHTECHNOLOGY</title>
    <style>
      :root {
        color-scheme: dark;
        --gold: #d8aa45;
        --blue: #9ed8ff;
        --ink: #050403;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --controls-space: 0px;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050403;
        font-family: Georgia, "Times New Roman", serif;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }

      #shell {
        position: fixed;
        inset: 0;
        min-height: var(--app-height, 100vh);
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: max(6px, var(--safe-top)) max(6px, var(--safe-right)) calc(max(6px, var(--safe-bottom)) + var(--controls-space)) max(6px, var(--safe-left));
        background-color: #010307;
        background-image:
          linear-gradient(rgba(103, 232, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(103, 232, 255, 0.04) 1px, transparent 1px),
          linear-gradient(180deg, #05080c 0%, #010205 100%);
        background-size: 40px 40px, 40px 40px, auto;
      }

      #startupIntro {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: #020201;
      }

      #startupIntro[hidden] {
        display: none;
      }

      #startupIntro video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #020201;
      }

      #introStart,
      #introSkip {
        position: fixed;
        z-index: 11;
        border: 1px solid rgba(216, 170, 69, 0.72);
        border-radius: 8px;
        background: rgba(7, 6, 5, 0.76);
        color: #f9e2a1;
        box-shadow: inset 0 0 18px rgba(216, 170, 69, 0.16), 0 10px 30px rgba(0, 0, 0, 0.48);
        font: 900 14px/1 system-ui, sans-serif;
        letter-spacing: 0;
        touch-action: manipulation;
        pointer-events: auto;
        -webkit-tap-highlight-color: transparent;
      }

      #introStart {
        left: 50%;
        bottom: max(42px, calc(env(safe-area-inset-bottom, 0px) + 28px));
        width: min(280px, calc(100vw - 42px));
        height: 54px;
        transform: translateX(-50%);
      }

      #introSkip {
        top: max(14px, env(safe-area-inset-top, 0px));
        right: max(14px, env(safe-area-inset-right, 0px));
        width: 96px;
        height: 38px;
        opacity: 0.9;
        pointer-events: auto;
        transition: opacity 180ms ease;
      }

      #startupIntro[data-playing="true"] #introStart {
        display: none;
      }

      #startupIntro[data-playing="true"] #introSkip {
        opacity: 0.82;
        pointer-events: auto;
      }

      #commercialBreak {
        position: fixed;
        inset: 0;
        z-index: 35;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #010307;
      }

      #commercialBreak[hidden] {
        display: none;
      }

      #commercialVideo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #010307;
      }

      .commercial-label,
      #commercialSkip {
        position: fixed;
        z-index: 36;
        border: 1px solid rgba(103, 232, 255, 0.72);
        background: rgba(1, 7, 11, 0.9);
        color: #eefaff;
        font: 900 12px/1 system-ui, sans-serif;
        letter-spacing: 0;
      }

      .commercial-label {
        top: max(14px, var(--safe-top));
        left: max(14px, var(--safe-left));
        padding: 11px 14px;
        border-left: 4px solid #ff405d;
        pointer-events: none;
      }

      #commercialSkip {
        top: max(14px, var(--safe-top));
        right: max(14px, var(--safe-right));
        min-width: 128px;
        min-height: 44px;
        border-right: 4px solid #ff405d;
        touch-action: manipulation;
      }

      #commercialSkip:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }

      #game {
        width: min(calc(100vw - max(12px, var(--safe-left)) - max(12px, var(--safe-right))), calc((100vh - var(--controls-space) - max(12px, var(--safe-top)) - max(12px, var(--safe-bottom))) * 16 / 9));
        width: min(calc(100vw - max(12px, var(--safe-left)) - max(12px, var(--safe-right))), calc((100dvh - var(--controls-space) - max(12px, var(--safe-top)) - max(12px, var(--safe-bottom))) * 16 / 9));
        height: min(calc(100vh - var(--controls-space) - max(12px, var(--safe-top)) - max(12px, var(--safe-bottom))), calc((100vw - max(12px, var(--safe-left)) - max(12px, var(--safe-right))) * 9 / 16));
        height: min(calc(100dvh - var(--controls-space) - max(12px, var(--safe-top)) - max(12px, var(--safe-bottom))), calc((100vw - max(12px, var(--safe-left)) - max(12px, var(--safe-right))) * 9 / 16));
        max-width: 1280px;
        max-height: 720px;
        display: block;
        background: #050403;
        box-shadow: 0 0 0 1px rgba(103, 232, 255, 0.48), -24px 0 72px rgba(255, 64, 93, 0.12), 24px 0 72px rgba(103, 232, 255, 0.12), 0 24px 80px rgba(0, 0, 0, 0.72);
        image-rendering: auto;
        touch-action: none;
      }

      #mobileControls {
        position: fixed;
        left: max(8px, var(--safe-left));
        right: max(8px, var(--safe-right));
        bottom: max(8px, var(--safe-bottom));
        display: none;
        justify-content: space-between;
        align-items: end;
        pointer-events: none;
        gap: clamp(8px, 2vw, 18px);
      }

      .pad,
      .buttons {
        display: grid;
        grid-template-columns: repeat(3, clamp(44px, 10vw, 58px));
        grid-auto-rows: clamp(44px, 8vw, 52px);
        gap: clamp(5px, 1.4vw, 8px);
        pointer-events: auto;
      }

      .buttons {
        grid-template-columns: repeat(3, clamp(44px, 8.5vw, 54px));
      }

      .combat-cluster {
        display: grid;
        gap: 6px;
        pointer-events: auto;
      }

      .control-zone {
        display: grid;
        gap: 4px;
        pointer-events: auto;
        transform: translate(var(--zone-x, 0px), var(--zone-y, 0px));
      }

      .touch-handle {
        min-height: 24px;
        border: 1px dashed rgba(158, 216, 255, 0.48);
        border-radius: 5px;
        background: rgba(4, 3, 3, 0.72);
        color: rgba(213, 234, 255, 0.9);
        font: 800 9px/1 system-ui, sans-serif;
        cursor: move;
        touch-action: none;
      }

      .utility-buttons {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 5px;
      }

      .utility-buttons .touch {
        min-height: 34px;
        font-size: 9px;
      }

      .touch {
        border: 1px solid rgba(103, 232, 255, 0.58);
        border-radius: 6px;
        background: rgba(2, 8, 12, 0.9);
        color: #eefaff;
        font: 800 clamp(10px, 2.5vw, 13px)/1 system-ui, sans-serif;
        box-shadow: inset 0 0 18px rgba(103, 232, 255, 0.08), 0 8px 20px rgba(0, 0, 0, 0.38);
        min-width: 0;
        min-height: 0;
        padding: 0;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }

      .touch:active,
      .touch[data-held="true"] {
        border-color: #fff;
        background: rgba(255, 64, 93, 0.3);
        color: #fff;
      }

      #combatZone .buttons .touch {
        border-color: rgba(255, 64, 93, 0.68);
      }

      #combatZone .buttons .touch:nth-child(5),
      #combatZone .buttons .touch:nth-child(6) {
        border-color: rgba(255, 200, 87, 0.78);
        color: #ffc857;
      }

      .blank {
        visibility: hidden;
      }

      .visually-hidden {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0 0 0 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }

      #accessibleActions {
        position: fixed;
        top: max(8px, var(--safe-top));
        left: max(8px, var(--safe-left));
        z-index: 30;
        width: 1px;
        height: 1px;
        overflow: hidden;
        pointer-events: none;
      }

      #accessibleActions:focus-within {
        width: min(320px, calc(100vw - 16px));
        height: auto;
        padding: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        overflow: visible;
        border: 1px solid rgba(216, 170, 69, 0.72);
        background: rgba(5, 4, 3, 0.96);
        pointer-events: auto;
      }

      #accessibleActions button,
      .settings-button,
      .binding-button {
        min-height: 44px;
        border: 1px solid rgba(216, 170, 69, 0.62);
        border-radius: 6px;
        background: #0b0907;
        color: #f9e2a1;
        font: 800 13px/1 system-ui, sans-serif;
      }

      #accessibleActions button:focus-visible,
      .settings-button:focus-visible,
      .binding-button:focus-visible,
      .touch:focus-visible {
        outline: 3px solid #9ed8ff;
        outline-offset: 2px;
      }

      .touch-player-label {
        position: absolute;
        left: 50%;
        bottom: calc(100% + 6px);
        transform: translateX(-50%);
        color: rgba(255, 246, 211, 0.8);
        font: 800 11px/1 system-ui, sans-serif;
        pointer-events: none;
      }

      #settingsPanel,
      #commandPanel,
      #trainingPanel {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: max(12px, var(--safe-top)) max(12px, var(--safe-right)) max(12px, var(--safe-bottom)) max(12px, var(--safe-left));
        background: rgba(0, 0, 0, 0.82);
      }

      #settingsPanel[hidden],
      #commandPanel[hidden],
      #trainingPanel[hidden] {
        display: none;
      }

      .settings-surface {
        width: min(760px, 100%);
        max-height: min(680px, calc(var(--app-height, 100vh) - 24px));
        overflow: auto;
        box-sizing: border-box;
        border: 1px solid rgba(216, 170, 69, 0.78);
        border-radius: 8px;
        padding: 18px;
        background: #080706;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.72);
        color: #f8f1d4;
        scrollbar-color: #d8aa45 #15110c;
        scrollbar-width: auto;
      }

      .settings-surface::-webkit-scrollbar {
        width: 12px;
      }

      .settings-surface::-webkit-scrollbar-track {
        background: #15110c;
      }

      .settings-surface::-webkit-scrollbar-thumb {
        border: 3px solid #15110c;
        border-radius: 6px;
        background: #d8aa45;
      }

      .settings-toolbar,
      .settings-actions,
      .binding-row,
      .binding-heading {
        display: grid;
        grid-template-columns: minmax(120px, 1fr) 150px 150px;
        align-items: center;
        gap: 10px;
      }

      .settings-toolbar {
        grid-template-columns: 1fr auto;
        margin-bottom: 12px;
        position: sticky;
        top: -18px;
        z-index: 2;
        padding: 18px 0 10px;
        background: #080706;
      }

      .settings-toolbar h2 {
        margin: 0;
        color: #ffd66d;
        font: 900 28px/1 Georgia, serif;
        letter-spacing: 0;
      }

      .settings-grid,
      .training-grid,
      #commandList {
        display: grid;
        gap: 10px;
        margin: 14px 0;
      }

      .training-actions {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
      }

      .setting-row,
      .training-row,
      .command-row {
        display: grid;
        grid-template-columns: minmax(140px, 1fr) minmax(150px, 1fr);
        align-items: center;
        gap: 12px;
        min-height: 44px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        font: 800 13px/1.25 system-ui, sans-serif;
      }

      .setting-row input,
      .setting-row select,
      .training-row input,
      .training-row select {
        width: 100%;
        min-height: 38px;
        box-sizing: border-box;
        accent-color: #d8aa45;
      }

      .command-row {
        grid-template-columns: 110px minmax(130px, 0.7fr) minmax(180px, 1.3fr);
      }

      .command-input {
        color: #9ed8ff;
      }

      .command-name {
        color: #ffd66d;
      }

      #commandIdentity {
        color: #d5eaff;
        font: 800 14px/1.4 system-ui, sans-serif;
      }

      body[data-high-contrast="true"] #game {
        box-shadow: 0 0 0 3px #fff, 0 24px 80px #000;
      }

      body[data-color-filter="deuteranopia"] #game {
        filter: saturate(0.82) hue-rotate(16deg) contrast(1.08);
      }

      body[data-color-filter="tritanopia"] #game {
        filter: saturate(0.88) hue-rotate(-18deg) contrast(1.08);
      }

      body[data-touch-layout="left"] #mobileControls {
        flex-direction: row-reverse;
      }

      body[data-touch-layout="left"] #padZone {
        order: 2;
      }

      body[data-touch-layout="left"] #combatZone {
        order: 1;
      }

      body[data-touch-layout="compact"] .touch {
        transform: scale(0.9);
      }

      #controllerStatus {
        min-height: 20px;
        margin: 0 0 14px;
        color: #9ed8ff;
        font: 700 13px/1.4 system-ui, sans-serif;
      }

      .settings-actions {
        grid-template-columns: repeat(2, minmax(120px, 1fr));
        margin-bottom: 18px;
      }

      .binding-heading {
        padding: 8px 0;
        border-bottom: 1px solid rgba(216, 170, 69, 0.32);
        color: rgba(255, 246, 211, 0.66);
        font: 800 11px/1 system-ui, sans-serif;
      }

      .binding-row {
        min-height: 52px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        font: 800 13px/1.2 system-ui, sans-serif;
      }

      .binding-button[data-listening="true"] {
        border-color: #9ed8ff;
        color: #fff;
      }

      .training-touch {
        display: none;
      }

      body[data-training="true"] .training-touch {
        display: block;
      }

      @media (pointer: coarse), (max-width: 820px) {
        :root {
          --controls-space: 0px;
        }

        body[data-phase="fight"] #mobileControls,
        body[data-phase="pause"] #mobileControls {
          display: flex;
        }
      }

      @media (pointer: coarse) and (orientation: portrait), (max-width: 820px) and (orientation: portrait) {
        :root {
          --controls-space: 0px;
        }

        html,
        body {
          overflow-y: auto;
        }

        body {
          min-height: var(--app-height, 100vh);
          display: flex;
          flex-direction: column;
          align-items: center;
          background-color: #010307;
          background-image:
            linear-gradient(rgba(103, 232, 255, 0.035) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 64, 93, 0.025) 1px, transparent 1px);
          background-size: 32px 32px;
        }

        body[data-phase="fight"],
        body[data-phase="pause"] {
          justify-content: flex-start;
        }

        #shell {
          position: relative;
          inset: auto;
          width: 100%;
          min-height: 0;
          align-items: start;
          padding-top: max(6px, var(--safe-top));
          padding-bottom: 0;
        }

        #game {
          width: calc(100vw - max(12px, var(--safe-left)) - max(12px, var(--safe-right)));
          height: auto;
          aspect-ratio: 16 / 9;
        }

        body[data-phase="fight"] #mobileControls,
        body[data-phase="pause"] #mobileControls {
          position: relative;
          inset: auto;
          width: calc(100% - max(16px, var(--safe-left)) - max(16px, var(--safe-right)));
          box-sizing: border-box;
          display: grid;
          grid-template-columns: auto auto;
          justify-items: center;
          margin-top: 8px;
          padding-bottom: max(12px, var(--safe-bottom));
        }

        body:not([data-phase="fight"]):not([data-phase="pause"]) #shell {
          min-height: var(--app-height, 100vh);
          align-items: center;
          padding-bottom: max(18px, var(--safe-bottom));
        }

        .touch-player-label {
          display: none;
        }

        .pad {
          grid-template-columns: repeat(3, clamp(44px, 13vw, 52px));
        }

        .buttons {
          grid-template-columns: repeat(3, clamp(44px, 13vw, 52px));
        }

        .pad,
        .buttons {
          grid-auto-rows: clamp(44px, 13vw, 52px);
          gap: 7px;
        }
      }

      @media (pointer: coarse) and (orientation: landscape), (max-width: 820px) and (orientation: landscape) {
        :root {
          --controls-space: 0px;
          --side-rail: clamp(156px, 18vw, 170px);
        }

        body[data-phase="fight"] #shell,
        body[data-phase="pause"] #shell {
          padding-left: max(var(--safe-left), var(--side-rail));
          padding-right: max(var(--safe-right), var(--side-rail));
        }

        body[data-phase="fight"] #game,
        body[data-phase="pause"] #game {
          width: calc(100vw - var(--side-rail) - var(--side-rail));
          height: auto;
          aspect-ratio: 16 / 9;
        }

        body[data-phase="fight"] #mobileControls,
        body[data-phase="pause"] #mobileControls {
          align-items: end;
        }

        .buttons {
          grid-template-columns: repeat(3, 44px);
        }

        .pad {
          grid-template-columns: repeat(3, 44px);
        }

        .pad,
        .buttons {
          grid-auto-rows: 44px;
          gap: 5px;
        }

        .touch {
          font-size: 10px;
        }

        .touch-player-label {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }

      @media (max-width: 620px) {
        .settings-surface {
          padding: 14px;
        }

        .settings-toolbar,
        .binding-row,
        .binding-heading {
          grid-template-columns: minmax(86px, 1fr) 104px 104px;
          gap: 6px;
        }

        .binding-button {
          font-size: 11px;
        }

        .setting-row,
        .training-row,
        .command-row {
          grid-template-columns: 1fr;
          gap: 6px;
          padding: 8px 0;
        }

        .training-actions {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div id="startupIntro" hidden>
      <video id="startupVideo" preload="none" playsinline></video>
      <button id="introStart" type="button">START INTRO</button>
      <button id="introSkip" type="button">PLAY GAME</button>
    </div>
    <section id="commercialBreak" aria-label="Arcade commercial break" hidden>
      <video id="commercialVideo" preload="metadata" playsinline></video>
      <div id="commercialLabel" class="commercial-label">ARCADE TRANSMISSION // NEXT LEVEL</div>
      <button id="commercialSkip" type="button">SKIP // A OR B</button>
    </section>
    <main id="shell" aria-label="GOTHTECHNOLOGY canvas game">
      <canvas id="game" width="1280" height="720" role="application" tabindex="0" aria-label="GOTHTECHNOLOGY fighting game" aria-describedby="gameInstructions"></canvas>
    </main>
    <p id="gameInstructions" class="visually-hidden">GOTHTECHNOLOGY fighting game. Use the accessible action menu, keyboard, touch controls, or up to two gamepads.</p>
    <div id="gameStatus" class="visually-hidden" role="status" aria-live="polite"></div>
    <nav id="accessibleActions" aria-label="Game actions"></nav>
    <div id="mobileControls" aria-label="Player 1 touch controls">
      <span class="touch-player-label">P1 TOUCH</span>
      <div id="padZone" class="control-zone">
        <button id="movePad" class="touch-handle" type="button" aria-label="Move directional controls">MOVE</button>
        <div class="pad">
          <button class="touch blank" type="button" tabindex="-1" aria-hidden="true"></button>
          <button class="touch" type="button" data-touch="p1.up" aria-label="Player 1 jump">UP</button>
          <button class="touch blank" type="button" tabindex="-1" aria-hidden="true"></button>
          <button class="touch" type="button" data-touch="p1.left" aria-label="Player 1 move left">LEFT</button>
          <button class="touch" type="button" data-touch="p1.down" aria-label="Player 1 crouch or low block">LOW</button>
          <button class="touch" type="button" data-touch="p1.right" aria-label="Player 1 move right">RIGHT</button>
        </div>
      </div>
      <div id="combatZone" class="control-zone">
        <button id="moveCombat" class="touch-handle" type="button" aria-label="Move attack controls">MOVE</button>
        <div class="combat-cluster">
          <div class="buttons">
            <button class="touch" type="button" data-touch="p1.lightPunch" aria-label="Player 1 light punch">LP</button>
            <button class="touch" type="button" data-touch="p1.heavyPunch" aria-label="Player 1 heavy punch">HP</button>
            <button class="touch" type="button" data-touch="p1.lightKick" aria-label="Player 1 light kick">LK</button>
            <button class="touch" type="button" data-touch="p1.heavyKick" aria-label="Player 1 heavy kick">HK</button>
            <button class="touch" type="button" data-touch="p1.special" aria-label="Player 1 special move">SP</button>
            <button class="touch" type="button" data-touch="p1.modifier" aria-label="Player 1 modifier. Combine with attack buttons for throw, super, assists, or taunt">MOD</button>
          </div>
          <div class="utility-buttons">
            <button class="touch" type="button" data-touch="p1.dash" aria-label="Player 1 dash">DASH</button>
            <button class="touch" type="button" data-touch="ui.pause">PAUSE</button>
            <button id="mobileCommands" class="touch" type="button">MOVES</button>
            <button id="mobileTrainingTools" class="touch training-touch" type="button">TOOLS</button>
          </div>
        </div>
      </div>
    </div>
    <div id="settingsPanel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
      <section class="settings-surface">
        <header class="settings-toolbar">
          <h2 id="settingsTitle">CONTROLS</h2>
          <button id="closeSettings" class="settings-button" type="button" aria-label="Close control settings">CLOSE</button>
        </header>
        <p id="controllerStatus" aria-live="polite"></p>
        <div class="settings-grid">
          <label class="setting-row"><span>MUSIC VOLUME</span><input id="musicVolume" type="range" min="0" max="1" step="0.05" /></label>
          <label class="setting-row"><span>SFX VOLUME</span><input id="sfxVolume" type="range" min="0" max="1" step="0.05" /></label>
          <label class="setting-row"><span>SCREEN SHAKE</span><input id="shakeAmount" type="range" min="0" max="1" step="0.1" /></label>
          <label class="setting-row"><span>VIBRATION</span><input id="vibrationToggle" type="checkbox" /></label>
          <label class="setting-row"><span>HIGH CONTRAST</span><input id="contrastToggle" type="checkbox" /></label>
          <label class="setting-row"><span>REDUCE FLASH</span><input id="reduceFlash" type="checkbox" /></label>
          <label class="setting-row"><span>COLOR VISION</span><select id="colorFilter"><option value="normal">STANDARD</option><option value="deuteranopia">RED-GREEN</option><option value="tritanopia">BLUE-YELLOW</option></select></label>
          <label class="setting-row"><span>HUD SCALE</span><input id="hudScale" type="range" min="0.8" max="1.3" step="0.05" /></label>
          <label class="setting-row"><span>TOUCH PRESET</span><select id="touchLayout"><option value="classic">CLASSIC</option><option value="left">LEFT HANDED</option><option value="compact">COMPACT</option></select></label>
        </div>
        <div class="settings-actions">
          <button id="fullscreenToggle" class="settings-button" type="button">FULLSCREEN</button>
          <button id="replayImport" class="settings-button" type="button">IMPORT REPLAY</button>
          <input id="replayImportFile" type="file" accept="application/json,.json" hidden />
          <button id="resetBindings" class="settings-button" type="button">RESET KEYS</button>
        </div>
        <div class="binding-heading" aria-hidden="true"><span>ACTION</span><span>PLAYER 1</span><span>PLAYER 2</span></div>
        <div id="keyBindings"></div>
      </section>
    </div>
    <div id="commandPanel" role="dialog" aria-modal="true" aria-labelledby="commandTitle" hidden>
      <section class="settings-surface">
        <header class="settings-toolbar">
          <h2 id="commandTitle">COMMAND LIST</h2>
          <button id="closeCommands" class="settings-button" type="button">CLOSE</button>
        </header>
        <p id="commandIdentity"></p>
        <div id="commandList"></div>
      </section>
    </div>
    <div id="trainingPanel" role="dialog" aria-modal="true" aria-labelledby="trainingTitle" hidden>
      <section class="settings-surface">
        <header class="settings-toolbar">
          <h2 id="trainingTitle">TRAINING TOOLS</h2>
          <button id="closeTraining" class="settings-button" type="button">CLOSE</button>
        </header>
        <div class="training-grid">
          <label class="training-row"><span>GUARD</span><select id="trainingGuard"><option value="off">OFF</option><option value="always">ALL</option><option value="random">RANDOM</option><option value="afterHit">AFTER HIT</option></select></label>
          <label class="training-row"><span>COUNTER HIT</span><input id="trainingCounter" type="checkbox" /></label>
          <label class="training-row"><span>WAKE-UP</span><select id="trainingWakeup"><option value="none">NONE</option><option value="jump">JUMP</option><option value="lightPunch">LIGHT PUNCH</option><option value="special">SPECIAL</option></select></label>
          <label class="training-row"><span>THROW TECH</span><input id="trainingThrowTech" type="checkbox" /></label>
          <label class="training-row"><span>INPUT DELAY</span><input id="trainingDelay" type="range" min="0" max="8" step="1" /></label>
          <label class="training-row"><span>HITBOX DISPLAY</span><input id="trainingHitboxes" type="checkbox" /></label>
          <label class="training-row"><span>FRAME DATA</span><input id="trainingFrameData" type="checkbox" /></label>
        </div>
        <div class="training-actions">
          <button id="trainingRecord" class="settings-button" type="button">RECORD</button>
          <button id="trainingPlayback" class="settings-button" type="button">PLAYBACK</button>
          <button id="trainingSave" class="settings-button" type="button">SAVE</button>
          <button id="trainingLoad" class="settings-button" type="button">LOAD</button>
          <button id="trainingReset" class="settings-button" type="button">RESET</button>
        </div>
      </section>
    </div>
    <script src="../../assets/js/lm-game-rewards-sdk.js?v=rewards-sdk-1"></script>
    <script type="module" src="./src/main.js?v=heartline36-leash-wrist"></script>
  </body>
</html>
