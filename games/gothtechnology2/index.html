<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050403" />
    <title>GOTHTECHNOLOGY</title>
    <style>
      :root {
        color-scheme: dark;
        --gold: #d8aa45;
        --blue: #9ed8ff;
        --ink: #050403;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --controls-space: 0px;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050403;
        font-family: Georgia, "Times New Roman", serif;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }

      #shell {
        position: fixed;
        inset: 0;
        min-height: var(--app-height, 100vh);
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: max(6px, var(--safe-top)) max(6px, var(--safe-right)) calc(max(6px, var(--safe-bottom)) + var(--controls-space)) max(6px, var(--safe-left));
        background:
          radial-gradient(circle at 50% 8%, rgba(142, 203, 229, 0.12), transparent 26%),
          radial-gradient(circle at 50% 88%, rgba(216, 170, 69, 0.14), transparent 24%),
          linear-gradient(180deg, #080706 0%, #020202 100%);
      }

      #startupIntro {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: #020201;
      }

      #startupIntro[hidden] {
        display: none;
      }

      #startupIntro video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #020201;
      }

      #introStart,
      #introSkip {
        position: fixed;
        z-index: 11;
        border: 1px solid rgba(216, 170, 69, 0.72);
        border-radius: 8px;
        background: rgba(7, 6, 5, 0.76);
        color: #f9e2a1;
        box-shadow: inset 0 0 18px rgba(216, 170, 69, 0.16), 0 10px 30px rgba(0, 0, 0, 0.48);
        font: 900 14px/1 system-ui, sans-serif;
        letter-spacing: 0;
        touch-action: manipulation;
        pointer-events: auto;
        -webkit-tap-highlight-color: transparent;
      }

      #introStart {
        left: 50%;
        bottom: max(42px, calc(env(safe-area-inset-bottom, 0px) + 28px));
        width: min(280px, calc(100vw - 42px));
        height: 54px;
        transform: translateX(-50%);
      }

      #introSkip {
        top: max(14px, env(safe-area-inset-top, 0px));
        right: max(14px, env(safe-area-inset-right, 0px));
        width: 96px;
        height: 38px;
        opacity: 0.9;
        pointer-events: auto;
        transition: opacity 180ms ease;
      }

      #startupIntro[data-playing="true"] #introStart {
        display: none;
      }

      #startupIntro[data-playing="true"] #introSkip {
        opacity: 0.82;
        pointer-events: auto;
      }

      #game {
        width: min(calc(100vw - max(12px, var(--safe-left)) - max(12px, var(--safe-right))), calc((100vh - var(--controls-space) - max(12px, var(--safe-top)) - max(12px, var(--safe-bottom))) * 16 / 9));
        width: min(calc(100vw - max(12px, var(--safe-left)) - max(12px, var(--safe-right))), calc((100dvh - var(--controls-space) - max(12px, var(--safe-top)) - max(12px, var(--safe-bottom))) * 16 / 9));
        height: min(calc(100vh - var(--controls-space) - max(12px, var(--safe-top)) - max(12px, var(--safe-bottom))), calc((100vw - max(12px, var(--safe-left)) - max(12px, var(--safe-right))) * 9 / 16));
        height: min(calc(100dvh - var(--controls-space) - max(12px, var(--safe-top)) - max(12px, var(--safe-bottom))), calc((100vw - max(12px, var(--safe-left)) - max(12px, var(--safe-right))) * 9 / 16));
        max-width: 1280px;
        max-height: 720px;
        display: block;
        background: #050403;
        box-shadow: 0 0 0 1px rgba(216, 170, 69, 0.32), 0 24px 80px rgba(0, 0, 0, 0.72);
        image-rendering: auto;
        touch-action: none;
      }

      #mobileControls {
        position: fixed;
        left: max(8px, var(--safe-left));
        right: max(8px, var(--safe-right));
        bottom: max(8px, var(--safe-bottom));
        display: none;
        justify-content: space-between;
        align-items: end;
        pointer-events: none;
        gap: clamp(8px, 2vw, 18px);
      }

      .pad,
      .buttons {
        display: grid;
        grid-template-columns: repeat(3, clamp(42px, 10vw, 58px));
        grid-auto-rows: clamp(40px, 8vw, 52px);
        gap: clamp(5px, 1.4vw, 8px);
        pointer-events: auto;
      }

      .buttons {
        grid-template-columns: repeat(5, clamp(42px, 8.5vw, 54px));
      }

      .touch {
        border: 1px solid rgba(216, 170, 69, 0.52);
        border-radius: 8px;
        background: rgba(7, 6, 5, 0.72);
        color: #f5d991;
        font: 800 clamp(10px, 2.5vw, 13px)/1 system-ui, sans-serif;
        box-shadow: inset 0 0 18px rgba(216, 170, 69, 0.12), 0 8px 20px rgba(0, 0, 0, 0.38);
        min-width: 0;
        min-height: 0;
        padding: 0;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }

      .touch:active,
      .touch[data-held="true"] {
        background: rgba(216, 170, 69, 0.24);
        color: #fff6d2;
      }

      .blank {
        visibility: hidden;
      }

      @media (pointer: coarse), (max-width: 820px) {
        :root {
          --controls-space: clamp(112px, 24dvh, 164px);
        }

        #mobileControls {
          display: flex;
        }
      }

      @media (pointer: coarse) and (orientation: portrait) {
        :root {
          --controls-space: clamp(190px, 32dvh, 260px);
        }

        #shell {
          align-items: start;
          padding-top: max(18px, var(--safe-top));
        }

        #mobileControls {
          display: grid;
          grid-template-columns: 1fr;
          justify-items: center;
        }
      }

      @media (max-height: 430px) and (pointer: coarse) {
        :root {
          --controls-space: clamp(74px, 21dvh, 96px);
        }

        .pad,
        .buttons {
          grid-auto-rows: clamp(34px, 12vh, 42px);
        }
      }
    </style>
  </head>
  <body>
    <div id="startupIntro" hidden>
      <video id="startupVideo" src="./assets/video/lottomind-live-startup.mp4" poster="./assets/user-title/gothtechnology-startup-bg.png" preload="auto" playsinline></video>
      <button id="introStart" type="button">START INTRO</button>
      <button id="introSkip" type="button">PLAY GAME</button>
    </div>
    <main id="shell" aria-label="GOTHTECHNOLOGY canvas game">
      <canvas id="game" width="1280" height="720"></canvas>
    </main>
    <div id="mobileControls" aria-hidden="true">
      <div class="pad">
        <button class="touch blank"></button>
        <button class="touch" data-touch="p1.up">UP</button>
        <button class="touch blank"></button>
        <button class="touch" data-touch="p1.left">LEFT</button>
        <button class="touch" data-touch="p1.down">LOW</button>
        <button class="touch" data-touch="p1.right">RIGHT</button>
      </div>
      <div class="buttons">
        <button class="touch" data-touch="p1.lightPunch">LP</button>
        <button class="touch" data-touch="p1.heavyPunch">HP</button>
        <button class="touch" data-touch="p1.lightKick">LK</button>
        <button class="touch" data-touch="p1.heavyKick">HK</button>
        <button class="touch" data-touch="p1.special">SP</button>
        <button class="touch" data-touch="p1.super">MAX</button>
        <button class="touch" data-touch="p1.throw">THR</button>
        <button class="touch" data-touch="p1.assist1">A1</button>
        <button class="touch" data-touch="p1.assist2">A2</button>
        <button class="touch" data-touch="p1.dash">DASH</button>
        <button class="touch" data-touch="ui.pause">PAUSE</button>
        <button class="touch" data-touch="ui.mute">MUTE</button>
      </div>
    </div>
    <script type="module" src="./src/main.js?v=shadow-ops-fix-1"></script>
  </body>
</html>
