<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <meta name="static-wave-leaderboard-endpoint" content="" />
    <title>2084 Static Wave - LottoMind</title>
    <link rel="icon" href="./assets/2084/branding/app-icon.png?v=chatgpt-wav-icon-1" />
    <link rel="preload" href="./assets/2084/branding/app-icon.png?v=chatgpt-wav-icon-1" as="image" />
    <link rel="preload" href="./assets/2084/branding/marquee-gameplay-keyart.png?v=gameplay-keyart-restored-1" as="image" />
    <link rel="preload" href="./assets/audio/startup-untitled-7.mp3" as="audio" type="audio/mpeg" />
    <link rel="stylesheet" href="./styles.css?v=graphics-evolution-1" />
  </head>
  <body>
    <main id="shell" data-mode="menu" aria-label="2084 Static Wave game">
      <canvas id="game" width="1280" height="720"></canvas>
      <canvas id="ultraFxCanvas" width="1280" height="720" aria-hidden="true"></canvas>

      <div id="startupScene" aria-hidden="true">
        <canvas id="startup3dCanvas" width="1280" height="720"></canvas>
        <div class="startup-scene-layer startup-scene-far"></div>
        <div class="startup-scene-layer startup-scene-mid"></div>
        <div class="startup-scene-layer startup-scene-emissive"></div>
        <div class="startup-scene-layer startup-scene-fog"></div>
        <div class="startup-scene-layer startup-scene-rails"></div>
        <div class="startup-scene-layer startup-scene-mask"></div>
      </div>

      <section id="hud" aria-live="polite">
        <div class="hud-cluster">
          <div class="hud-chip">
            <span data-label="score"></span>
            <strong id="scoreValue">0</strong>
          </div>
          <div class="hud-chip compact">
            <span data-label="level"></span>
            <strong id="levelValue">1</strong>
          </div>
          <div class="hud-chip compact">
            <span data-label="objective"></span>
            <strong id="objectiveValue">0</strong>
          </div>
        </div>
        <div class="hud-cluster right">
          <div class="hud-chip compact">
            <span data-label="lives"></span>
            <strong id="livesValue">3</strong>
          </div>
          <div class="hud-chip compact">
            <span data-label="bombs"></span>
            <strong id="bombsValue">3</strong>
          </div>
          <div class="hud-chip compact">
            <span data-label="multiplier"></span>
            <strong id="multiplierValue">1</strong>
          </div>
        </div>
      </section>

      <div id="statusStrip">
        <span id="statusText"></span>
        <span id="bestText"></span>
      </div>
      <div id="bossMeter" class="boss-meter" hidden aria-live="polite">
        <span id="bossName">CROWN SIGNAL</span>
        <div><i id="bossMeterFill"></i></div>
      </div>

      <div id="forgeHud" class="forge-panel forge-hud" aria-live="polite">
        <button id="forgeHudClose" class="forge-close" type="button" aria-label=""></button>
        <span id="forgeHudLabel"></span>
        <strong id="forgeHudLine"></strong>
        <small id="forgeHudNote"></small>
      </div>
      <button id="forgeToggleAction" class="forge-toggle" type="button" hidden></button>

      <section id="overlay" data-state="menu" aria-labelledby="menuTitle">
        <h1 id="menuTitle" class="sr-only">2084 Static Wave gameplay portal</h1>
        <div id="startupBrand" aria-hidden="true">
          <img id="startupMark" src="./assets/2084/branding/app-icon.png?v=chatgpt-wav-icon-1" alt="" />
        </div>
        <div id="marqueeMotion" aria-hidden="true">
          <canvas id="marqueeFx" width="1280" height="720"></canvas>
          <img id="marquee" src="./assets/2084/branding/marquee-gameplay-keyart.png?v=gameplay-keyart-restored-1" alt="" />
          <span class="marquee-status">Signal Ready</span>
        </div>
        <div id="startupForge" class="forge-panel startup-forge" aria-live="polite">
          <span id="startupForgeLabel"></span>
          <strong id="startupForgeLine"></strong>
          <small id="startupForgeNote"></small>
        </div>
        <h1 id="overlayTitle"></h1>
        <p id="overlayCopy"></p>
        <div id="overlayStats" hidden></div>
        <section id="rewardPanel" class="reward-panel" hidden aria-live="polite">
          <strong id="rewardGrade"></strong>
          <div><span id="rewardMedal"></span><span id="rewardXp"></span></div>
          <p id="rewardUnlocks"></p>
        </section>
        <div id="shareResultPanel" class="share-result-panel" hidden>
          <button id="shareResultToggle" class="share-result-toggle" type="button" aria-expanded="false"></button>
          <div id="shareResultOptions" class="share-result-options" hidden>
            <button id="shareFacebookAction" type="button"></button>
            <button id="shareInstagramAction" type="button"></button>
            <button id="shareXAction" type="button"></button>
          </div>
          <p id="shareResultStatus" class="share-result-status" aria-live="polite"></p>
        </div>
        <section id="scoreboardPanel" class="scoreboard-panel" aria-labelledby="scoreboardTitle" hidden>
          <div class="scoreboard-header">
            <span id="scoreboardTitle"></span>
            <small id="scoreboardNote"></small>
          </div>
          <div class="scoreboard-tabs" role="tablist" aria-label="Scoreboard source">
            <button id="localScoresAction" type="button" role="tab" aria-selected="true">Local</button>
            <button id="communityScoresAction" type="button" role="tab" aria-selected="false">Community</button>
          </div>
          <ol id="scoreboardList" class="scoreboard-list"></ol>
        </section>
        <div id="playerChooser" class="player-chooser" aria-label="Player count"></div>
        <section id="preflightPanel" class="preflight-panel" aria-label="Mission setup">
          <div class="preflight-group">
            <span>Mode</span>
            <div id="modeChooser" class="segmented-control"></div>
          </div>
          <div class="preflight-group">
            <span>Difficulty</span>
            <div id="difficultyChooser" class="segmented-control"></div>
          </div>
          <div class="pilot-briefing">
            <strong id="pilotBriefingTitle"></strong>
            <span id="pilotBriefingText"></span>
          </div>
          <div id="profileSummary" class="profile-summary"></div>
        </section>
        <p id="controlsHint" class="controls-hint"></p>
        <div id="loadingProgress" class="loading-progress" hidden aria-live="polite">
          <span id="loadingProgressLabel">Arming signal 0%</span>
          <div><i id="loadingProgressFill"></i></div>
        </div>
        <div class="overlay-actions">
          <button id="primaryAction" type="button"></button>
          <button id="homeAction" type="button" hidden></button>
          <button id="soundAction" type="button"></button>
          <button id="settingsAction" type="button">Settings</button>
          <button id="fullscreenAction" type="button" aria-pressed="false">Full Screen</button>
        </div>
      </section>

      <section id="settingsPanel" class="settings-panel" hidden aria-labelledby="settingsTitle">
        <div class="settings-header">
          <h2 id="settingsTitle">Signal Settings</h2>
          <button id="settingsCloseAction" class="icon-action" type="button" aria-label="Close settings">X</button>
        </div>
        <label>Music <input id="musicVolumeInput" type="range" min="0" max="1" step="0.05" /></label>
        <label>Sound effects <input id="sfxVolumeInput" type="range" min="0" max="1" step="0.05" /></label>
        <label>Effects intensity <input id="effectsInput" type="range" min="0.25" max="1" step="0.05" /></label>
        <label>Camera shake <input id="shakeInput" type="range" min="0" max="1" step="0.05" /></label>
        <label>Color mode
          <select id="colorModeInput">
            <option value="standard">Standard</option>
            <option value="contrast">High contrast</option>
            <option value="deuteranopia">Green-safe</option>
          </select>
        </label>
        <label>Controls
          <select id="controlPresetInput">
            <option value="classic">WASD + IJKL</option>
            <option value="arrows">Arrows + IJKL</option>
            <option value="lefty">IJKL + WASD</option>
          </select>
        </label>
        <label>Graphics preset
          <select id="graphicsPresetInput">
            <option value="auto">Auto (recommended)</option>
            <option value="mobile">Mobile</option>
            <option value="high">High WebGL2</option>
            <option value="ultra">Ultra WebGPU</option>
          </select>
          <small id="graphicsStatus" class="graphics-status" aria-live="polite"></small>
        </label>
        <label class="toggle-setting"><input id="dynamicResolutionInput" type="checkbox" /> Dynamic resolution</label>
        <label class="toggle-setting"><input id="hapticsInput" type="checkbox" /> Haptics</label>
        <label class="toggle-setting"><input id="tutorialInput" type="checkbox" /> Tutorial prompts</label>
        <div class="settings-actions">
          <button id="tutorialResetAction" type="button">Replay Tutorial</button>
          <button id="settingsDoneAction" type="button">Done</button>
        </div>
      </section>

      <section id="tutorialPanel" class="tutorial-panel" hidden aria-live="polite">
        <small id="tutorialStep"></small>
        <strong id="tutorialMessage"></strong>
        <button id="tutorialSkipAction" type="button">Skip</button>
      </section>

      <button id="pauseAction" class="icon-action top-action" type="button" aria-label=""></button>
      <button id="bombAction" class="bomb-action" type="button" aria-label=""><span>B</span></button>

      <div id="touchMarks" aria-hidden="true">
        <div class="touch-zone left-zone"><span></span></div>
        <div class="touch-zone right-zone"><span></span></div>
      </div>

      <div id="fxLayer" aria-hidden="true"></div>
      <div id="bannerText" hidden></div>
      <div id="dev"></div>
    </main>
    <script type="module" src="./src/startup3d.js?v=fullscreen-button-1"></script>
    <script type="module" src="./src/marqueeMotion.js?v=fullscreen-button-1"></script>
    <script type="module" src="./src/game.js?v=no-reflection-1"></script>
    <script>
      (() => {
        const fullscreenButton = document.getElementById("fullscreenAction");
        const focusGame = () => {
          const canvas = document.getElementById("game");
          canvas?.setAttribute("tabindex", "-1");
          canvas?.focus({ preventScroll: true });
        };

        if (!fullscreenButton) return;

        const sync = () => {
          const fullscreen = Boolean(document.fullscreenElement);
          fullscreenButton.textContent = fullscreen ? "Exit Full" : "Full Screen";
          fullscreenButton.setAttribute("aria-pressed", String(fullscreen));
        };

        fullscreenButton.addEventListener("click", async () => {
          try {
            if (document.fullscreenElement) {
              await document.exitFullscreen();
            } else {
              await (document.getElementById("shell") || document.documentElement).requestFullscreen();
            }
          } catch {
            fullscreenButton.textContent = "Full Screen";
          }
          sync();
          focusGame();
        });
        document.addEventListener("fullscreenchange", sync);
        sync();
      })();
    </script>
  </body>
</html>
