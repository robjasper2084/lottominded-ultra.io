<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="title desc">
  <title id="title">Audio number orb</title>
  <desc id="desc">A glowing abstract orb with rhythm rings and neon reflections.</desc>
  <defs>
    <radialGradient id="orb" cx=".3" cy=".24" r=".76">
      <stop stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset=".22" stop-color="#29f7ff"/>
      <stop offset=".62" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#05070d"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="420" height="420" fill="none"/>
  <circle cx="210" cy="210" r="132" fill="url(#orb)" filter="url(#glow)"/>
  <g fill="none" stroke-linecap="round">
    <circle cx="210" cy="210" r="164" stroke="#ffe071" stroke-width="5" opacity=".55"/>
    <circle cx="210" cy="210" r="98" stroke="#5eff9d" stroke-width="4" opacity=".72"/>
    <path d="M82 212c48-42 72-42 120 0s72 42 120 0" stroke="#29f7ff" stroke-width="8"/>
    <path d="M118 268c40 26 68 26 108 0s68-26 108 0" stroke="#ff4fd8" stroke-width="5" opacity=".78"/>
  </g>
</svg>
