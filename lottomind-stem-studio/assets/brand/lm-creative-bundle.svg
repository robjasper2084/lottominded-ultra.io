    <path d="M124 240h136M124 270h96" stroke="#5eff9d" stroke-width="8" stroke-linecap="round"/>
    <path d="M476 146h112M476 184h148M476 222h126M476 260h96" stroke="#ffe071" stroke-width="8" stroke-linecap="round"/>
