<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">LottoMind Stem Studio logo</title>
  <desc id="desc">A neon waveform orb with layered stem rings.</desc>
  <defs>
    <radialGradient id="orb" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#e9fff5"/>
      <stop offset=".28" stop-color="#36ffd0"/>
      <stop offset=".58" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#11162f"/>
    </radialGradient>
    <linearGradient id="gold" x1="14" x2="230" y1="232" y2="24">
      <stop stop-color="#ffe071"/>
      <stop offset=".5" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#29f7ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" values="0 0 0 0 0.13 0 0 0 0 0.95 0 0 0 0 1 0 0 0 .85 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="#060912"/>
  <circle cx="128" cy="128" r="84" fill="url(#orb)" opacity=".9" filter="url(#glow)"/>
  <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-width="8">
    <path d="M36 132c18-60 44-90 76-90 40 0 48 42 70 42 14 0 24-14 38-38"/>
    <path d="M34 151c26-18 46-20 60-6 21 21 50 27 84 2 17-13 30-18 44-14"/>
    <path d="M58 188c31 13 62 9 93-12 25-17 45-22 61-14"/>
  </g>
  <g stroke="#ecfff8" stroke-width="5" stroke-linecap="round" opacity=".85">
    <path d="M83 121v33M106 100v76M128 84v94M150 102v70M173 119v39"/>
  </g>
</svg>
