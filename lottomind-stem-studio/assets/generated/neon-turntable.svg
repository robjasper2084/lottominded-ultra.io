<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Neon turntable fallback art</title>
  <desc id="desc">An original futuristic DJ deck with a glowing jog wheel and waveform ring.</desc>
  <defs>
    <linearGradient id="deck" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#111832"/>
      <stop offset=".5" stop-color="#090d18"/>
      <stop offset="1" stop-color="#181024"/>
    </linearGradient>
    <linearGradient id="line" x1="70" x2="570" y1="350" y2="40">
      <stop stop-color="#2bfff2"/>
      <stop offset=".48" stop-color="#a75dff"/>
      <stop offset="1" stop-color="#ffdd6c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="28" y="34" width="584" height="352" rx="34" fill="url(#deck)" stroke="#26375e"/>
  <circle cx="250" cy="210" r="132" fill="#070a12" stroke="url(#line)" stroke-width="6" filter="url(#glow)"/>
  <circle cx="250" cy="210" r="88" fill="none" stroke="#37ffcf" stroke-width="2" stroke-dasharray="7 10"/>
  <circle cx="250" cy="210" r="42" fill="#121a2d" stroke="#ffe071" stroke-width="4"/>
  <path d="M126 206c21-36 41 34 59 0s36 38 56 0 42 32 63 0 34 29 60 1" fill="none" stroke="#ff4fd8" stroke-width="5" stroke-linecap="round"/>
  <rect x="440" y="78" width="18" height="240" rx="9" fill="#070b16" stroke="#314368"/>
  <rect x="433" y="174" width="32" height="54" rx="10" fill="#2bfff2" opacity=".85"/>
  <g fill="#0b1020" stroke="url(#line)" stroke-width="3">
    <rect x="475" y="86" width="82" height="46" rx="14"/>
    <rect x="475" y="148" width="82" height="46" rx="14"/>
    <rect x="475" y="210" width="82" height="46" rx="14"/>
    <rect x="475" y="272" width="82" height="46" rx="14"/>
  </g>
  <path d="M102 344h438" stroke="#24345b" stroke-width="2"/>
</svg>
