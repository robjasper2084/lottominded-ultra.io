<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-labelledby="title desc">
  <title id="title">Pad matrix fallback art</title>
  <desc id="desc">An original 4 by 4 neon performance pad grid.</desc>
  <defs>
    <linearGradient id="case" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#101a2e"/><stop offset="1" stop-color="#050812"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect x="24" y="24" width="472" height="472" rx="44" fill="url(#case)" stroke="#25385c"/>
  <g transform="translate(72 72)">
    <script type="application/ecmascript"><![CDATA[]]></script>
    <rect x="0" y="0" width="78" height="78" rx="18" fill="#20f7ff"/><rect x="100" y="0" width="78" height="78" rx="18" fill="#9b6cff"/><rect x="200" y="0" width="78" height="78" rx="18" fill="#ff4fd8"/><rect x="300" y="0" width="78" height="78" rx="18" fill="#ffe071"/>
    <rect x="0" y="100" width="78" height="78" rx="18" fill="#66ff9a"/><rect x="100" y="100" width="78" height="78" rx="18" fill="#22c6ff"/><rect x="200" y="100" width="78" height="78" rx="18" fill="#d66bff"/><rect x="300" y="100" width="78" height="78" rx="18" fill="#ff7a5c"/>
    <rect x="0" y="200" width="78" height="78" rx="18" fill="#ffe071"/><rect x="100" y="200" width="78" height="78" rx="18" fill="#2bfff2"/><rect x="200" y="200" width="78" height="78" rx="18" fill="#5eff9d"/><rect x="300" y="200" width="78" height="78" rx="18" fill="#8b5cff"/>
    <rect x="0" y="300" width="78" height="78" rx="18" fill="#ff4fd8"/><rect x="100" y="300" width="78" height="78" rx="18" fill="#37ffcf"/><rect x="200" y="300" width="78" height="78" rx="18" fill="#ffdc62"/><rect x="300" y="300" width="78" height="78" rx="18" fill="#2b8cff"/>
    <g opacity=".45" filter="url(#soft)">
      <rect x="0" y="0" width="78" height="78" rx="18" fill="#20f7ff"/><rect x="200" y="0" width="78" height="78" rx="18" fill="#ff4fd8"/>
      <rect x="100" y="200" width="78" height="78" rx="18" fill="#2bfff2"/><rect x="300" y="300" width="78" height="78" rx="18" fill="#2b8cff"/>
    </g>
  </g>
</svg>
